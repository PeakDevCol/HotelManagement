# RNF-07: every pull request to develop runs the shared tests and builds Android and desktop.
# It needs no secrets: without google-services.json the apps build with Firebase disabled.
name: CI

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-and-builds:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Shared tests
        run: ./gradlew :shared:allTests :shared:testAndroidHostTest

      - name: Build Android and desktop
        run: ./gradlew :androidApp:assembleDebug :desktopApp:assemble
